name: Code Style

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  code-style:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      # 1️⃣ Run PHP-CS-Fixer (dry run)
      - name: Check code style with PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --verbose

      # 2️⃣ Run PHPCS
      - name: Run PHP_CodeSniffer
        run: vendor/bin/phpcs --standard=PSR12 app

      # 3️⃣ Auto-fix & commit back if on develop
      - name: Auto-fix and commit (only on develop)
        if: github.ref == 'refs/heads/develop'
        run: |
          vendor/bin/php-cs-fixer fix --verbose
          vendor/bin/phpcbf --standard=PSR12 app

          if [[ `git status --porcelain` ]]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add .
            git commit -m "chore: auto fix code style issues [ci skip]"
            git push origin develop
          fi
