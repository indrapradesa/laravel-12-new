name: Code Style

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  code-style:
    runs-on: ubuntu-latest

    steps:
      # 🔁 Checkout source code
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 🛠️ Setup PHP environment
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo

      # 📦 Install Composer dependencies
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      # ✅ Step 1: Jalankan PHPCS (linting PSR-12)
      - name: Run PHP_CodeSniffer
        run: |
          if [ -d "app" ]; then
            ./vendor/bin/phpcs --standard=PSR12 app
          else
            echo "No 'app' folder found, skipping PHPCS."
          fi

      # 🔧 Step 2: Auto-fix & commit jika di branch 'development'
      - name: Auto-fix and commit (only on development)
        if: github.ref == 'refs/heads/development'
        run: |
          ./vendor/bin/php-cs-fixer fix --verbose
          ./vendor/bin/phpcbf --standard=PSR12 app

          if [[ `git status --porcelain` ]]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add .
            git commit -m "chore: auto fix code style issues [ci skip]"
            git pull --rebase --autostash
            git push origin development
          fi

      # 🔍 Step 3: Check apakah masih ada pelanggaran (CI fail jika iya)
      - name: Check code style with PHP-CS-Fixer
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff --verbose
